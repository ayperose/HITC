<!DOCTYPE html>
<html><head><meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@900&family=Space+Grotesk:wght@500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#E8E8E4;font-family:'Space Grotesk',sans-serif;padding:48px;display:flex;flex-direction:column;gap:40px}
.row{display:flex;gap:40px;align-items:flex-start;flex-wrap:wrap}
.card{background:white;border-radius:16px;padding:32px;display:flex;flex-direction:column;align-items:center;gap:16px}
.label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#8A96A8}
.nav-dropdown{position:relative;display:flex;align-items:center}
.nav-dropdown-panel{position:absolute;top:calc(100% + 14px);left:50%;transform:translateX(-50%);background:#FFFFFF;border:1px solid #E0E0D8;border-radius:14px;padding:6px;min-width:210px;box-shadow:0 8px 32px rgba(0,0,0,.12),0 2px 8px rgba(0,0,0,.06);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;transform:translateX(-50%) translateY(-4px)}
.nav-dropdown:hover .nav-dropdown-panel{opacity:1;pointer-events:all;transform:translateX(-50%) translateY(0)}.nav-dropdown-panel::before{content:"";position:absolute;top:-16px;left:0;right:0;height:16px}.nav-dropdown-panel::before{content:"";position:absolute;top:-16px;left:0;right:0;height:16px}
.nav-dropdown-panel a{display:block;padding:7px 12px;border-radius:8px;font-size:12px;color:#3A4560;text-decoration:none;font-weight:500;transition:background .12s,color .12s;white-space:nowrap;font-family:'Space Grotesk',sans-serif}
.nav-dropdown-panel a:hover{background:#F4F4F0;color:#0A0F1C}</style>
</head>
<body>
<div class="row">
  <div class="card">
    <div class="label">Original PNG</div>
    <img src="brand_assets/hitc%20logo%202006%20-%20Copy.png" style="width:300px;height:auto"/>
  </div>
  <div class="card">
    <div class="label">Vector SVG</div>
    <img src="brand_assets/hitc-logo-vector.svg" style="width:300px;height:auto"/>
  </div>
  <div class="card">
    <div class="label">Vector — Large</div>
    <img src="brand_assets/hitc-logo-vector.svg" style="width:500px;height:auto"/>
  </div>
</div>
<div class="row">
  <div class="card" style="background:#0A0F1C">
    <div class="label" style="color:#4A5A6A">On dark</div>
    <img src="brand_assets/hitc-logo-vector.svg" style="width:280px;height:auto"/>
  </div>
  <div class="card" style="background:#1E6BFF">
    <div class="label" style="color:rgba(255,255,255,.5)">On blue</div>
    <img src="brand_assets/hitc-logo-vector.svg" style="width:280px;height:auto"/>
  </div>
</div>
</body></html>
